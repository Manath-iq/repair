# Публикация демо-лендинга на GitHub Pages.
# Сайт лежит в web/ — на Pages уезжает именно эта папка, а не корень
# репозитория: в корне документация комплекта, ей на витрине делать нечего.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Сборки нет, но проверка сходимости цифр есть — и она обязана
      # пройти до публикации, а не после.
      - name: Проверить сходимость
        run: node scripts/check.mjs
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
